aid: vori
name: Vori
description: >-
  Vori is a connected point-of-sale and operations platform built exclusively
  for independent grocery stores, unifying checkout, payments (EBT, eWIC,
  contactless, gift cards), loyalty and SMS marketing, ordering, receiving,
  invoice processing, inventory, pricing automation, and reporting in one
  system. The Vori REST API at api.vori.com lets grocers and their integrations
  read and manage store catalog data — store products, pricing rules, product
  history, and search — using bearer-token authentication.
