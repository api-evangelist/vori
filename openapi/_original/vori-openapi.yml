# Vori API — OpenAPI 3.0.0
# Harvested 2026-07-21 by the API Evangelist enrichment pipeline (method: searched).
# Source: the OpenAPI fragments Vori publishes verbatim on each API reference page at
# https://help.vori.com/api-reference/store-products/*.md (the docs cite /api/openapi.json,
# which is login-gated; every operation's spec fragment is public on its docs page and
