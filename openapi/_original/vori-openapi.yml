openapi: 3.0.0
info:
  title: Vori API
  description: Read and manage your store catalog, vendors, and inventory. Requests require a bearer token;
    see "Connect to the Vori REST API" for how to obtain one.
  version: 1.0.0
  contact: {}
servers:
- url: https://api.vori.com
  description: production
security: []
tags: []
paths:
  /v1/store-products:
    post:
      tags:
      - Store products
      summary: Create store product
      operationId: createStoreProduct
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreProductWrapperDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProductDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DuplicateBarcodeTypesForProductError'
                - $ref: '#/components/schemas/DuplicateBarcodesError'
                - $ref: '#/components/schemas/InvalidBarcodeError'
                - $ref: '#/components/schemas/InvalidDepartmentError'
                - $ref: '#/components/schemas/InvalidFoodModifiersError'
                - $ref: '#/components/schemas/InvalidItemModifiersError'
                - $ref: '#/components/schemas/InvalidTaxRatesError'
                - $ref: '#/components/schemas/InvalidUnitOfMeasureError'
                - $ref: '#/components/schemas/InvalidVariableWeightsError'
                - $ref: '#/components/schemas/SoftDeletedBarcodeConflictError'
        '403':
          description: ''
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/InsufficientPermissionsError'
                - $ref: '#/components/schemas/NoBannerAssociationError'
      security:
      - bearer: []
    get:
      tags:
      - Store products
      summary: List store products
      description: Lists store products. Use the `state` parameter to filter, sort, and paginate results.
      operationId: listStoreProducts
      parameters:
      - name: state
        required: false
        in: query
        description: "Filter, sort, and paginate products with a URL-encoded JSON object:\n\n```json\n\
          {\n  \"startRow\": 0,\n  \"endRow\": 50,\n  \"filterModel\": { \"<field>\": <filter> },\n  \"\
          sortModel\": [{ \"colId\": \"<field>\", \"sort\": \"asc\" }]\n}\n```\n\nAny other top-level\
          \ property is rejected.\n\n**Pagination** — `startRow` and `endRow` select which slice of results\
          \ to return: `startRow` defaults to 0, and `endRow` defaults to `startRow` plus 10. You can\
          \ request at most 1000 rows at a time (`endRow - startRow <= 1000`). The response's `rowCount`\
          \ field always reflects the total number of matching rows across the entire result set, not\
          \ just the rows returned in this request.\n\n**Sorting** — `sortModel` orders results by any\
          \ filterable field except the related-entity fields, plus `id`. If you don't specify a `sortModel`,\
          \ results are sorted by `created_at` descending (newest first).\n\n**Filtering** — `filterModel`\
          \ is an object keyed by field name, where each value describes how to match that field:\n\n\
          | Filter | Example | `type` values | Fields |\n| ------ | ------- | --------------- | ------\
          \ |\n| Set | `{\"filterType\": \"set\", \"values\": [\"1\", \"2\"]}` | <ul><li><code>in</code></li><li><code>notIn</code></li></ul>\
          \ | <ul><li><code>barcode_type</code></li><li><code>retail_price_uom_id</code></li><li><code>store_department_id</code></li><li><code>store_id</code></li><li><code>unit_of_measure_mapping_id</code></li></ul>\
          \ |\n| Boolean | `{\"filterType\": \"boolean\", \"values\": [true]}` | <ul><li><code>in</code></li><li><code>notIn</code></li></ul>\
          \ | <ul><li><code>active</code></li><li><code>earns_loyalty_points</code></li><li><code>ebt_enabled</code></li><li><code>ecommerce_enabled</code></li><li><code>esl_enabled</code></li><li><code>is_blackhawk_gift_card</code></li><li><code>is_reloadable_blackhawk_gift_card</code></li><li><code>is_tippable</code></li><li><code>manual_item</code></li><li><code>print_physical_tag</code></li><li><code>prompt_for_quantity</code></li><li><code>snap_incentive_earnable</code></li><li><code>snap_incentive_redeemable</code></li><li><code>sync_to_deli_scales</code></li><li><code>variable_sale_price</code></li><li><code>wic_enabled</code></li></ul>\
          \ |\n| Text | `{\"filterType\": \"text\", \"type\": \"contains\", \"filter\": \"cola\"}` | <ul><li><code>equals</code></li><li><code>notEqual</code></li><li><code>contains</code></li><li><code>notContains</code></li><li><code>startsWith</code></li><li><code>endsWith</code></li><li><code>blank</code></li><li><code>notBlank</code></li></ul>\
          \ | <ul><li><code>barcode</code></li><li><code>brand_string</code></li><li><code>country_of_origin</code></li><li><code>description</code></li><li><code>name</code></li><li><code>raw_barcode</code></li><li><code>unit_volume_string</code></li><li><code>wic_override_plu</code></li></ul>\
          \ |\n| Number | `{\"filterType\": \"number\", \"type\": \"greaterThan\", \"filter\": 10}` |\
          \ <ul><li><code>equals</code></li><li><code>notEqual</code></li><li><code>lessThan</code></li><li><code>lessThanOrEqual</code></li><li><code>greaterThan</code></li><li><code>greaterThanOrEqual</code></li><li><code>inRange</code></li><li><code>blank</code></li><li><code>notBlank</code></li></ul>\
          \ | <ul><li><code>base_retail_price</code></li><li><code>case_cost</code></li><li><code>case_size</code></li><li><code>current_margin</code></li><li><code>each_cost</code></li><li><code>lb_cost</code></li><li><code>min_customer_age</code></li><li><code>pack_size</code></li><li><code>store_product.unit_of_measure_amount</code></li><li><code>target_margin</code></li></ul>\
          \ |\n| Date | `{\"filterType\": \"date\", \"type\": \"greaterThan\", \"dateFrom\": \"2026-01-01\"\
          , \"dateTo\": null}` | <ul><li><code>equals</code></li><li><code>notEqual</code></li><li><code>lessThan</code></li><li><code>greaterThan</code></li><li><code>inRange</code></li><li><code>blank</code></li><li><code>notBlank</code></li></ul>\
          \ | <ul><li><code>base_retail_price_start_time</code></li><li><code>created_at</code></li><li><code>updated_at</code></li></ul>\
          \ |\n| Related entities | `{\"filterType\": \"set\", \"values\": [\"1\"]}` | <ul><li><code>in</code></li></ul>\
          \ | <ul><li><code>store_product_item_modifiers.item_modifier_id</code></li><li><code>store_product_tax_rates.tax_rate_id</code></li><li><code>store_product_variable_weights.variable_weight_id</code></li></ul>\
          \ |\n| Product group rules | `{\"filterType\": \"set\", \"values\": [\"0195f9a8-7d64-7c3a-b7f5-3e0a5a2b9c11\"\
          ]}` | <ul><li><code>in</code></li></ul> | <ul><li><code>store_product_group_rule_ids</code></li></ul>\
          \ |\n\n`type` is optional for set and boolean filters and defaults to `in`. Boolean fields also\
          \ accept set filters, and date fields also accept `\"filterType\": \"datetime\"`. Set filters\
          \ must be flat — compound `AND`/`OR` conditions are rejected."
        schema:
          $ref: '#/components/schemas/DataFrameListConfigDto'
      - name: include
        required: false
        in: query
        description: 'Comma-separated list of related data to include on each product:


          - `active_vendor` — Populates `active_vendor` with the product''s primary vendor.

          - `active_vendor_product` — Populates `active_vendor_product` with the primary vendor''s catalog
          entry, including costs.

          - `inventory` — Populates `inventory` with on-hand quantity data.

          - `store_vendor_products` — Populates `store_vendor_products` with every vendor''s catalog entry
          for the product.'
        schema:
          type: array
          items:
            $ref: '#/components/schemas/StoreProductLoaders'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProductsListDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/InvalidStoresError'
                - $ref: '#/components/schemas/UnsupportedStateFieldError'
        '403':
          description: ''
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/InsufficientPermissionsError'
                - $ref: '#/components/schemas/NoBannerAssociationError'
      security:
      - bearer: []
  /v1/store-products/{id}/rules:
    get:
      tags:
      - Store products
      summary: Get processed store product rule
      operationId: getProcessedStoreProductRule
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessedStoreProductRuleDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/InsufficientPermissionsError'
                - $ref: '#/components/schemas/NoBannerAssociationError'
        '404':
          description: ''
      security:
      - bearer: []
  /v1/store-products/{id}:
    get:
      tags:
      - Store products
      summary: Get store product
      operationId: getStoreProduct
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
      - name: include
        required: false
        in: query
        description: 'Comma-separated list of related data to include on each product:


          - `active_vendor` — Populates `active_vendor` with the product''s primary vendor.

          - `active_vendor_product` — Populates `active_vendor_product` with the primary vendor''s catalog
          entry, including costs.

          - `inventory` — Populates `inventory` with on-hand quantity data.

          - `store_vendor_products` — Populates `store_vendor_products` with every vendor''s catalog entry
          for the product.'
        schema:
          type: array
          items:
            $ref: '#/components/schemas/StoreProductLoaders'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProductDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/InsufficientPermissionsError'
                - $ref: '#/components/schemas/NoBannerAssociationError'
        '404':
          description: ''
      security:
      - bearer: []
    patch:
      tags:
      - Store products
      summary: Update store product
      operationId: updateStoreProduct
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreProductWrapperDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProductDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DuplicateBarcodeTypesForProductError'
                - $ref: '#/components/schemas/DuplicateBarcodesError'
                - $ref: '#/components/schemas/InvalidBarcodeError'
                - $ref: '#/components/schemas/InvalidDepartmentError'
                - $ref: '#/components/schemas/InvalidFoodModifiersError'
                - $ref: '#/components/schemas/InvalidItemModifiersError'
                - $ref: '#/components/schemas/InvalidTaxRatesError'
                - $ref: '#/components/schemas/InvalidUnitOfMeasureError'
                - $ref: '#/components/schemas/InvalidVariableWeightsError'
                - $ref: '#/components/schemas/SoftDeletedBarcodeConflictError'
        '403':
          description: ''
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/InsufficientPermissionsError'
                - $ref: '#/components/schemas/NoBannerAssociationError'
        '404':
          description: ''
      security:
      - bearer: []
  /v1/store-products/rules:
    get:
      tags:
      - Store products
      summary: List processed store product rules
      operationId: listProcessedStoreProductRules
      parameters:
      - name: state
        required: false
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProcessedStoreProductRuleDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/InsufficientPermissionsError'
                - $ref: '#/components/schemas/NoBannerAssociationError'
      security:
      - bearer: []
  /v1/store-products/{id}/history:
    get:
      tags:
      - Store products
      summary: List store product history
      description: Retrieve change history for a specific store product
      operationId: listStoreProductHistory
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
      - name: state
        required: false
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListStoreProductHistoryDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/InsufficientPermissionsError'
                - $ref: '#/components/schemas/NoBannerAssociationError'
        '404':
          description: ''
      security:
      - bearer: []
  /v1/store-products/{id}/restore:
    post:
      tags:
      - Store products
      summary: Restore store product
      description: Restore a soft-deleted store product
      operationId: restoreStoreProduct
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProductDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientPermissionsError'
        '404':
          description: ''
      security:
      - bearer: []
  /v1/store-products/search:
    get:
      tags:
      - Store products
      summary: Search store products
      description: Endpoint for fast full-text product search. This returns only what is indexed in Algolia
        and does not hit the database.
      operationId: searchStoreProducts
      parameters:
      - name: page
        required: false
        in: query
        schema:
          minimum: 1
          default: 1
          type: integer
      - name: take
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 1000
          default: 10
          type: integer
      - name: store_ids
        required: true
        in: query
        schema:
          type: array
          items:
            type: string
            pattern: ^-?[0-9]+$
      - name: query
        required: true
        in: query
        schema:
          type: string
      - name: active
        required: false
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProductTypeaheadSearchPageDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/InsufficientPermissionsError'
                - $ref: '#/components/schemas/NoBannerAssociationError'
      security:
      - bearer: []
components:
  schemas:
    CreateStoreProductWrapperDto:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CreateStoreProductDto'
      required:
      - data
    StoreProductDto:
      type: object
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          nullable: true
          description: When the product was soft-deleted, or null if it has not been deleted.
          format: date-time
        store_id:
          type: string
          description: ID of the store this product belongs to.
          pattern: ^[0-9]+$
        department_id:
          type: string
          description: ID of the store department this product belongs to.
          pattern: ^[0-9]+$
        tax_rates:
          description: Tax rates applied to this product at the register.
          type: array
          items:
            $ref: '#/components/schemas/NestedTaxRateDto'
        item_modifiers:
          description: Item modifiers available for this product.
          type: array
          items:
            $ref: '#/components/schemas/NestedItemModifierDto'
        food_modifier_categories:
          description: Food modifier categories, and their modifiers, available for this product, ordered
            by category priority.
          type: array
          items:
            $ref: '#/components/schemas/NestedFoodModifierCategoryDto'
        additional_barcodes:
          description: Barcodes that resolve to this product in addition to the primary `barcode`.
          type: array
          items:
            $ref: '#/components/schemas/StoreProductBarcodeDto'
        variable_weights:
          description: Preset weights for products sold by weight.
          type: array
          items:
            $ref: '#/components/schemas/NestedVariableWeightDto'
        active_vendor:
          description: The vendor currently supplying this product.
          allOf:
          - $ref: '#/components/schemas/NestedStoreVendorDTO'
        active_vendor_product:
          description: The vendor catalog entry currently supplying this product.
          allOf:
          - $ref: '#/components/schemas/NestedStoreVendorProductDTO'
        store_vendor_products:
          description: Vendor catalog entries for this product.
          type: array
          items:
            $ref: '#/components/schemas/NestedStoreVendorProductDTO'
        inventory:
          description: Current inventory levels. Included when requested via `include=inventory`.
          allOf:
          - $ref: '#/components/schemas/NestedStoreProductInventoryDto'
        brand:
          type: string
          nullable: true
          description: Brand name.
        description:
          type: string
          nullable: true
          description: Short description, intended for character-limited use cases (e.g., printed receipts).
        active:
          type: boolean
          description: Whether the product is active.
        name:
          type: string
          description: Human-readable product name.
        barcode:
          type: string
          description: Primary barcode.
        target_margin:
          type: string
          nullable: true
          description: Target gross margin for pricing decisions, as a whole-number percentage (35 means
            35%).
          example: '199.99'
          pattern: ^-?[0-9]+(\.[0-9]+)?$
        case_size:
          type: integer
          nullable: true
          description: Number of sellable units in a vendor case.
        pack_size:
          type: integer
          nullable: true
          description: Number of units in a retail pack.
        print_physical_tag:
          type: boolean
          description: Whether a physical shelf tag should be printed for this product.
        esl_enabled:
          type: boolean
          description: Whether electronic shelf labels are enabled for this product.
        label_last_printed_at:
          type: string
          nullable: true
          description: When a shelf tag was last printed for this product.
          format: date-time
        wicable:
          type: integer
          nullable: true
          description: WIC eligibility indicator.
        min_customer_age:
          type: integer
          nullable: true
          description: Minimum customer age, in years, required to purchase.
        wic_enabled:
          type: boolean
          description: Whether the product is eligible for WIC payment.
        snap_enabled:
          type: boolean
          description: Whether the product is eligible for SNAP payment.
        ebt_enabled:
          type: boolean
          description: Whether the product is eligible for EBT/SNAP payment.
        ecommerce_enabled:
          type: boolean
          description: Whether the product is available for e-commerce.
        variable_sale_price:
          type: boolean
          description: Whether the sale price is entered at the register instead of fixed.
        sold_by_weight:
          type: boolean
          description: Whether the product is sold by weight rather than by unit.
        prompt_for_quantity:
          type: boolean
          description: Whether the register prompts for a quantity when the product is scanned.
        manual_item:
          type: boolean
          description: Whether the product is entered manually at the register rather than scanned.
        is_tippable:
          type: boolean
          description: Whether purchases of this product can include a tip.
        is_blackhawk_gift_card:
          type: boolean
          description: Whether the product is a Blackhawk gift card.
        is_reloadable_blackhawk_gift_card:
          type: boolean
          description: Whether the product is a reloadable Blackhawk gift card.
        snap_incentive_earnable:
          type: boolean
          description: Whether purchases of this product earn SNAP incentives.
        snap_incentive_redeemable:
          type: boolean
          description: Whether SNAP incentives can be redeemed against this product.
        discount_restrictions:
          type: array
          nullable: true
          description: Discount types that may not be applied to this product.
          items:
            $ref: '#/components/schemas/DiscountRestriction'
        loyalty_points_per_dollar:
          type: string
          nullable: true
          description: Loyalty points earned per dollar spent. Null defaults to one point per dollar.
          pattern: ^[0-9]+(\.[0-9]+)?$
          example: '199.99'
        unit_volume_quantity:
          type: string
          nullable: true
          description: Net content quantity, in the unit given by `unit_volume_uom_name`.
          example: '199.99'
          pattern: ^-?[0-9]+(\.[0-9]+)?$
        unit_volume_uom_name:
          type: string
          nullable: true
          description: Unit of measure for `unit_volume_quantity`.
        unit_price:
          type: string
          nullable: true
          description: Retail price per unit of measure, in dollars.
          example: '199.99'
          pattern: ^-?[0-9]+(\.[0-9]+)?$
        retail_price:
          type: string
          nullable: true
          description: Current shelf/retail price in dollars.
          format: positive-monetary
          pattern: ^[0-9]+(\.[0-9]+)?$
          example: '199.99'
        minimum_retail_price:
          type: string
          nullable: true
          description: Lower bound for the retail price, in dollars.
          format: positive-monetary
          pattern: ^[0-9]+(\.[0-9]+)?$
          example: '199.99'
        maximum_retail_price:
          type: string
          nullable: true
          description: Upper bound for the retail price, in dollars.
          format: positive-monetary
          pattern: ^[0-9]+(\.[0-9]+)?$
          example: '199.99'
        retail_price_effective_at:
          type: string
          nullable: true
          description: When the current retail price took effect.
          format: date-time
        retail_price_unit_of_measure:
          nullable: true
          description: Unit of measure the retail price applies to.
          allOf:
          - $ref: '#/components/schemas/UnitOfMeasureDto'
        disable_pos_sync:
          type: boolean
          description: Whether synchronization of this product to the point-of-sale is disabled.
        primary_vendor_configuration:
          description: How the primary vendor is selected for this product.
          allOf:
          - $ref: '#/components/schemas/PrimaryVendorConfiguration'
        country_of_origin:
          type: string
          nullable: true
          maxLength: 3
          minLength: 3
          description: ISO 3166-1 alpha-3 country code of origin.
        sync_to_deli_scales:
          type: boolean
          default: false
          description: Whether the product is synchronized to deli scales.
      required:
      - id
      - created_at
      - updated_at
      - deleted_at
      - store_id
      - department_id
      - tax_rates
      - item_modifiers
      - food_modifier_categories
      - additional_barcodes
      - variable_weights
      - brand
      - description
      - active
      - name
      - barcode
      - target_margin
      - case_size
      - pack_size
      - print_physical_tag
      - esl_enabled
      - label_last_printed_at
      - wicable
      - min_customer_age
      - wic_enabled
      - snap_enabled
      - ebt_enabled
      - ecommerce_enabled
      - variable_sale_price
      - sold_by_weight
      - prompt_for_quantity
      - manual_item
      - is_tippable
      - is_blackhawk_gift_card
      - is_reloadable_blackhawk_gift_card
      - snap_incentive_earnable
